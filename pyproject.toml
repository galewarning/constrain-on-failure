[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "constrain-on-failure"
version = "1.0.0"
description = "Selective schema-constrained retry for local LLM function calling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "scipy>=1.16,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
benchmark = [
  "bfcl-eval==2026.3.23",
  "openai>=1.0,<3",
  "soundfile>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

